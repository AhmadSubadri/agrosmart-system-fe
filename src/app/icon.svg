      <stop offset="0%" stop-color="#1B261C"/>
      <stop offset="100%" stop-color="#2C3E2D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DE9D"/>
      <stop offset="100%" stop-color="#D9C589"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5C49B"/>
